# Builds the app and publishes it to GitHub Pages on every push, and deploys the Cloudflare
# Worker + database (worker/) when the Cloudflare secrets are set.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions"; for Cloudflare, the repo
# secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ALLOWED_EMAILS.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/employee-payments-tracker-cpyeay, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Cloudflare secrets set?
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$ALLOWED_EMAILS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets not set yet; skipping the Worker deploy."
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        name: Database and backup store (created the first time)
        run: |
          set -euo pipefail
          d1_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "little-lash") | .uuid'; }
          kv_id() { npx wrangler kv namespace list | jq -r '.[] | select(.title | test("little-lash-backups$")) | .id'; }
          ID=$(d1_id)
          if [ -z "$ID" ]; then npx wrangler d1 create little-lash < /dev/null; ID=$(d1_id); fi
          KV=$(kv_id)
          if [ -z "$KV" ]; then npx wrangler kv namespace create little-lash-backups < /dev/null; KV=$(kv_id); fi
          test -n "$ID" && test -n "$KV"
          sed -i "s/__D1_ID__/$ID/; s/__KV_ID__/$KV/" wrangler.toml
      - if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply little-lash --remote
      - if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
      - if: steps.check.outputs.ready == 'true'
        name: Allowed email addresses
        run: printf '%s' "$ALLOWED_EMAILS" | npx wrangler secret put ALLOWED_EMAILS
